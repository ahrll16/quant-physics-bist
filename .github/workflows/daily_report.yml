name: BIST 100 Daily Quant Engine & Dashboard

on:
  schedule:
    - cron: '30 15 * * *' # Her gün TSİ 18:30
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-scanner-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scikit-learn xgboost requests joblib google-genai

      - name: Run BIST Daily Scanner
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          python bist_daily_scanner.py

      - name: Deploy Page to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: .
